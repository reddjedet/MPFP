    - id: DEC-01
      title: "Test isolation violated — pytest runs mutate production data/*.db"
      severity: high
      eval: R5
      status: resolved
      resolved_on: 2026-09-25
      resolution: >-
        Injectable data directory via env var MPFP_DATA_DIR (services/data_paths.py);
        11 services resolve persistence through data_file(); tests/conftest.py redirects
        tests to a tempfile snapshot seeded from data/ (excludes backups/, *-wal, *-shm);
        scripts/test.sh now fails the pipeline if tests mutate data/ (guard hardened after
        independent review: comparison always runs even when pytest fails, and any file
        created when data/ was absent at baseline counts as mutation).
      verification: "R5 3/3 clean runs at k=3; 263/263 tests pass; ./scripts/test.sh 100% green."
      residual_risks:
        - "Path constants are import-time; an externally installed pytest plugin importing services.* before conftest would capture production paths (none found in repo)."
        - "Snapshot temp dir is cleaned at pytest_sessionfinish; SIGKILL can leak it (no production data impact)."

