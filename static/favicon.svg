<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#121319" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Financial Trendline -->
  <path d="M14 44 L25 31 L35 39 L49 18" fill="none" stroke="url(#neonGreenGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  
  <!-- Arrow tip -->
  <path d="M39 18 L49 18 L49 28" fill="none" stroke="#69F0AE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Data Nodes -->
  <circle cx="14" cy="44" r="3.5" fill="#00E676" />
  <circle cx="25" cy="31" r="3.5" fill="#00E676" />
  <circle cx="35" cy="39" r="3.5" fill="#00E676" />
  <circle cx="49" cy="18" r="4" fill="#69F0AE" filter="url(#neonGlow)" />
</svg>