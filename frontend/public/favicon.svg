<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mpfpBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="mpfpAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Badge Eigengrau -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0f1015" stroke="url(#mpfpBlueGrad)" stroke-width="1.8" />

  <!-- Geometría Institucional: Engranaje Cuantitativo / Nodos de Máquina PFP -->
  <!-- Línea de Tendencia Ascendente con Nodos -->
  <path d="M14 44 L26 32 L36 38 L50 18" fill="none" stroke="url(#mpfpAccent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
  
  <!-- Punta de Flecha de Crecimiento -->
  <path d="M40 18 L50 18 L50 28" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nodos de Datos Cuantitativos -->
  <circle cx="14" cy="44" r="3" fill="#10b981" />
  <circle cx="26" cy="32" r="3" fill="#38bdf8" />
  <circle cx="36" cy="38" r="3" fill="#2563eb" />
  <circle cx="50" cy="18" r="3.5" fill="#60a5fa" filter="url(#subtleGlow)" />

  <!-- Iniciales Monograma MPFP Inferior -->
  <text x="32" y="55" font-family="'JetBrains Mono', monospace, sans-serif" font-size="7.5" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MPFP</text>
</svg>