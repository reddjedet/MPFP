<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mpfpBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="mpfpTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="mpfpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fondo Dark Badge con esquinas redondeadas modernas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0d13" stroke="url(#mpfpBorderGrad)" stroke-width="2.5" />

  <!-- Acento visual cuantitativo superior: barra de pulso de mercado -->
  <rect x="18" y="10" width="28" height="2.5" rx="1.25" fill="#38bdf8" opacity="0.85" filter="url(#mpfpGlow)" />

  <!-- Monograma MPFP centrado, tipografía geométrica bold de alta legibilidad a 16px/32px -->
  <text 
    x="32" 
    y="38" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-size="16.5" 
    font-weight="900" 
    letter-spacing="0.5" 
    fill="url(#mpfpTextGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    filter="url(#mpfpGlow)">MPFP</text>

  <!-- Detalle geométrico base: micro grid financiero / nodos -->
  <circle cx="23" cy="51" r="2" fill="#10b981" />
  <rect x="28" y="50" width="8" height="2" rx="1" fill="#2563eb" />
  <circle cx="41" cy="51" r="2" fill="#38bdf8" />
</svg>